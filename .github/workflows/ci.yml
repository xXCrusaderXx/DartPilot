name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs when the same PR is pushed again. Each push to main
# gets its own group so a burst of merges does not cancel the main runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Checks only the lines a PR changes, so existing code is never reformatted
  # as a side effect of an unrelated change.
  format:
    name: format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Pinned so CI and contributors format identically; distro versions drift.
      - name: Install clang-format
        run: pipx install clang-format==23.1.1

      - name: Check formatting of changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          if ! out="$(git clang-format --diff --extensions h,hpp,cpp "$base" "$HEAD_SHA" -- engine tests)"; then
            echo "$out"
            echo "::error::Formatting differs from .clang-format. Run: git clang-format origin/$BASE_REF"
            exit 1
          fi
          echo "$out"

  build-ubuntu:
    name: build (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Cached packages; a cold cache on a slow mirror can still take a while.
      - name: Install dependencies
        timeout-minutes: 25
        uses: ./.github/actions/install-ubuntu-deps

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDARTPILOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-arch:
    name: build (arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Rolling release: catches breakage with the newest OpenCV and compilers early.
    container: archlinux:latest
    steps:
      # git for GoogleTest's FetchContent; OpenCV's optional runtime deps (vtk, hdf5, ...)
      # are not pulled in by pacman but are needed by its CMake config, and qt6-base by
      # libopencv_highgui, which Arch builds against Qt 6.
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja git opencv vtk hdf5 glew fmt qt6-base

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDARTPILOT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  flutter:
    name: flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Pinned so CI and contributors format and analyse identically.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/src test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # The release builds these; building them here shows breakage before a release.
  # The Linux bundle is built without the engine, which the build job covers.
  flutter-build:
    name: flutter build (linux, web)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev \
            desktop-file-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Build web
        run: flutter build web --release

      - name: Check the packaging scripts
        working-directory: packaging/linux
        run: |
          for script in *.sh; do bash -n "$script"; done
          desktop-file-validate ../../ui/linux/packaging/io.github.xxcrusaderxx.dartpilot.desktop
