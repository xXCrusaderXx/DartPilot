version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tools
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /ui
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ["*"]
